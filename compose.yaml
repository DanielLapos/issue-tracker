services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      - "POSTGRES_PASSWORD=${DB_PASSWORD}"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_DB=postgres"
      - "PGDATA=/var/lib/postgresql/18/docker"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/18/docker

volumes:
  db-data:
